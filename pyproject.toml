[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lessongen"
version = "1.0.0"
description = "Autonomous agentic beginner lesson generator and evaluator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "groq>=0.9.0",
    "python-docx>=1.1.0",
    "textstat>=0.7.3",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "rich>=13.7.0",
]

[tool.setuptools.packages.find]
include = ["lessongen*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
