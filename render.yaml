services:
  - type: web
    name: lessongen-studio
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "uvicorn lessongen.web.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEN_MODEL
        value: gemini-flash-latest
      - key: JUDGE_MODEL
        value: qwen/qwen3.8-27b
      - key: CACHE_ENABLED
        value: "true"
